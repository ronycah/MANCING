<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" id="laut-svg">
  <defs>
    <!-- Warna (siang) ada di public/style.css, blok LAUT. -->
  </defs>

  <!-- ==================== 1. LANGIT (SKY) ==================== -->
  <rect id="laut-langit-bg" class="laut-langit" x="0" y="0" width="800" height="320" />

  <!-- Matahari / Bulan -->
  <circle id="laut-matahari-bulat" class="laut-matahari" cx="620" cy="115" r="48" />

  <!-- ==================== 2. AWAN (CLOUDS) ==================== -->
  <g id="laut-awan-grup">
    <!-- Awan Kiri -->
    <path id="laut-awan-1" class="laut-awan" d="M 70 140
             a 20 20 0 0 1 30 -10
             a 30 30 0 0 1 50 0
             a 20 20 0 0 1 30 10
             a 15 15 0 0 1 -10 25
             l -90 0
             a 15 15 0 0 1 -10 -25 Z" />

    <!-- Awan Tengah -->
    <path id="laut-awan-2" class="laut-awan" d="M 340 80
             a 15 15 0 0 1 25 -8
             a 25 25 0 0 1 40 0
             a 15 15 0 0 1 25 8
             a 12 12 0 0 1 -8 20
             l -74 0
             a 12 12 0 0 1 -8 -20 Z" />
  </g>

  <!-- Burung camar (garis melengkung) -->
  <g id="laut-camar-grup">
    <path class="laut-camar" d="M 250 190 Q 260 180 270 190 Q 280 180 290 190" />
    <path class="laut-camar" d="M 470 160 Q 478 152 486 160 Q 494 152 502 160" />
  </g>

  <!-- ==================== 3. PULAU JAUH DI CAKRAWALA ==================== -->
  <g id="laut-pulau-grup">
    <path id="laut-pulau" class="laut-pulau" d="M 80 322 Q 140 270 210 322 Z" />
    <path class="laut-pulau" d="M 640 322 Q 720 262 800 305 L 800 322 Z" />
  </g>

  <!-- ==================== 4. LAUT (SEA WATER) ==================== -->
  <g id="laut-air-grup">
    <!-- Air dekat (dasar) -->
    <rect id="laut-air-dasar" class="laut-air" x="0" y="320" width="800" height="280" />

    <!-- Pita air jauh di dekat cakrawala (lebih terang) -->
    <path id="laut-air-jauh" class="laut-air-jauh" d="M 0 320 L 800 320 L 800 372 Q 600 360 400 372 T 0 366 Z" />

    <!-- Perahu layar kecil di kejauhan -->
    <g id="laut-perahu">
      <polygon class="laut-layar" points="540,296 540,338 516,338" />
      <polygon class="laut-layar" points="546,302 546,338 566,338" />
      <path class="laut-lambung" d="M 508 340 L 574 340 L 564 350 L 520 350 Z" />
    </g>

    <!-- Garis ombak (statis) -->
    <g id="laut-ombak-grup">
      <path class="laut-ombak" d="M 70 392 q 15 -9 30 0 t 30 0 t 30 0" />
      <path class="laut-ombak" d="M 560 388 q 15 -9 30 0 t 30 0 t 30 0 t 30 0" />
      <path class="laut-ombak" d="M 250 412 q 15 -9 30 0 t 30 0 t 30 0" />
      <path class="laut-ombak" d="M 110 446 q 15 -9 30 0 t 30 0 t 30 0 t 30 0" />
      <path class="laut-ombak" d="M 590 450 q 15 -9 30 0 t 30 0 t 30 0" />
      <path class="laut-ombak" d="M 40 506 q 15 -9 30 0 t 30 0 t 30 0" />
      <path class="laut-ombak" d="M 650 512 q 15 -9 30 0 t 30 0 t 30 0 t 30 0" />
      <path class="laut-ombak" d="M 540 540 q 15 -9 30 0 t 30 0 t 30 0" />
    </g>
  </g>

  <!-- ==================== 4b. PELAMPUNG ==================== -->
  <!-- Tersembunyi sampai wadah laut mendapat kelas "lempar" (diatur mancing.js, animasi di style.css). -->
  <g id="laut-pelampung" class="laut-pelampung">
    <!-- Lingkaran riak di permukaan air (tidak ikut turun-naik) -->
    <ellipse class="laut-pelampung-riak" cx="400" cy="396" rx="36" ry="9" />
    <!-- Bagian yang jatuh saat dilempar -->
    <g class="laut-pelampung-jatuh">
      <!-- Bagian yang mengapung dan tersentak saat gigitan -->
      <g class="laut-pelampung-badan">
        <rect class="laut-pelampung-antena" x="396" y="346" width="8" height="26" rx="3" />
        <path class="laut-pelampung-merah" d="M 376 392 a 24 24 0 0 1 48 0 Z" />
        <path class="laut-pelampung-putih" d="M 376 392 a 24 24 0 0 0 48 0 Z" />
      </g>
    </g>
  </g>

  <!-- ==================== 5. PANTAI PASIR (BEACH) ==================== -->
  <g id="laut-pantai-grup">
    <!-- Pasir kiri bawah -->
    <path id="laut-pasir-kiri" class="laut-pasir" d="M 0 500 Q 110 520 190 600 L 0 600 Z" />
    <!-- Pasir kanan bawah -->
    <path id="laut-pasir-kanan" class="laut-pasir" d="M 800 510 Q 700 530 620 600 L 800 600 Z" />
    <!-- Buih di tepi pasir -->
    <path class="laut-buih" d="M 0 500 Q 110 520 190 600" />
    <path class="laut-buih" d="M 800 510 Q 700 530 620 600" />
    <!-- Batu karang kecil -->
    <ellipse class="laut-batu" cx="60" cy="572" rx="26" ry="12" />
    <ellipse class="laut-batu" cx="748" cy="574" rx="22" ry="10" />
  </g>

  <!-- ==================== 6. DERMAGA KAYU (WOODEN PIER) ==================== -->
  <g id="laut-dermaga">
    <!-- Perspektif dermaga kayu utama (Trapesium) -->
    <polygon points="260,600 540,600 470,440 330,440" class="laut-kayu" />

    <!-- Garis papan kayu -->
    <polygon points="325,455 475,455 471,460 329,460" class="laut-kayu-gelap" />
    <polygon points="315,475 485,475 480,482 320,482" class="laut-kayu-gelap" />
    <polygon points="302,498 498,498 492,506 308,506" class="laut-kayu-gelap" />
    <polygon points="288,525 512,525 505,534 295,534" class="laut-kayu-gelap" />
    <polygon points="273,558 527,558 519,568 281,568" class="laut-kayu-gelap" />

    <!-- Sisi samping/pinggiran kayu -->
    <polygon points="260,600 273,600 335,440 330,440" class="laut-kayu-gelap" />
    <polygon points="540,600 527,600 465,440 470,440" class="laut-kayu-gelap" />
  </g>
</svg>
