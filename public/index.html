<!--public/index.html -->
<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Mancing Santuy</title>
        <meta name="theme-color" content="#2a9d8f" />
        <!-- Path relatif (tanpa awalan /) supaya jalan di GitHub Pages -->
        <link rel="manifest" href="manifest.json" />
        <!-- Ikon tab browser dan ikon layar utama iPhone/iPad -->
        <link rel="icon" type="image/svg+xml" href="img/favicon.svg" />
        <link
            rel="icon"
            type="image/png"
            sizes="96x96"
            href="img/favicon-96x96.png"
        />
        <link rel="shortcut icon" href="img/favicon.ico" />
        <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
        <style>
            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                background: #bde6f2;
                color: #1d3557;
                font-family: system-ui, sans-serif;
                text-align: center;
                padding: 16px;
                box-sizing: border-box;
            }
            h1 {
                font-size: 2rem;
                margin: 0 0 8px;
            }
            p {
                font-size: 1.1rem;
                margin: 0;
            }
        </style>
        <!-- CSS terpusat game (ditulis sendiri, tanpa CDN) -->
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <h1>🎣 Mancing Santuy</h1>
        <p>Game mancing santai.</p>

        <!-- Wadah layar akun (Daftar, Masuk, Keluar), diisi oleh akun.js -->
        <main id="akun" class="akun"></main>

        <!-- Pengaturan publik (URL project dan kunci publik) -->
        <script src="config.js"></script>
        <!-- Pustaka Supabase, versi dipatok (bukan latest) -->
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
        <!-- Layar Pilih nama, Ganti nama, layar utama (AKN.05); dimuat sebelum akun.js -->
        <script src="nama.js"></script>
        <!-- Layar Buat password baru dari link reset email (AKN.06); dimuat sebelum akun.js -->
        <script src="password.js"></script>
        <!-- Layar akun: Daftar, Masuk, Keluar (AKN.04) -->
        <script src="akun.js"></script>
        <!-- Daftarkan service worker (PWA) -->
        <script>
            if ("serviceWorker" in navigator) {
                window.addEventListener("load", function () {
                    navigator.serviceWorker.register("sw.js");
                });
            }
        </script>
    </body>
</html>
