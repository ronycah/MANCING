<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" id="danau-svg">
  <defs>
    <!-- Warna (siang, sore, malam) ada di public/style.css, blok DANAU. -->
  </defs>

  <!-- ==================== 1. LANGIT (SKY) ==================== -->
  <rect id="danau-langit-bg" class="danau-langit" x="0" y="0" width="800" height="420" />

  <!-- Matahari / Bulan -->
  <circle id="danau-matahari-bulat" class="danau-matahari" cx="640" cy="110" r="45" />

  <!-- ==================== 2. AWAN (CLOUDS) ==================== -->
  <g id="danau-awan-grup">
    <!-- Awan Kiri -->
    <path id="danau-awan-1" class="danau-awan" d="M 80 130
             a 20 20 0 0 1 30 -10
             a 30 30 0 0 1 50 0
             a 20 20 0 0 1 30 10
             a 15 15 0 0 1 -10 25
             l -90 0
             a 15 15 0 0 1 -10 -25 Z" />

    <!-- Awan Kanan -->
    <path id="danau-awan-2" class="danau-awan" d="M 580 90
             a 15 15 0 0 1 25 -8
             a 25 25 0 0 1 40 0
             a 15 15 0 0 1 25 8
             a 12 12 0 0 1 -8 20
             l -74 0
             a 12 12 0 0 1 -8 -20 Z" />
  </g>

  <!-- ==================== 3. PEGUNUNGAN & POHON (HILLS & TREES) ==================== -->
  <g id="danau-bukit-grup">
    <!-- Bukit Jauh -->
    <path id="danau-bukit-jauh" class="danau-bukit-jauh" d="M 0 310 Q 180 230 380 290 T 800 260 L 800 380 L 0 380 Z" />

    <!-- Pohon Latar Jauh Kiri -->
    <path class="danau-bukit-jauh" d="M 30 270 A 25 25 0 0 1 70 270 L 70 320 L 30 320 Z" />
    <path class="danau-bukit-jauh" d="M 60 260 A 20 20 0 0 1 95 260 L 95 320 L 60 320 Z" />

    <!-- Bukit Dekat -->
    <path id="danau-bukit-dekat" class="danau-bukit-dekat" d="M 0 330 Q 240 260 480 320 T 800 300 L 800 390 L 0 390 Z" />

    <!-- Dedaunan / Pepohonan Kiri Dekat -->
    <path class="danau-bukit-dekat" d="M -20 280 Q 40 250 80 330 Z" />
    <path class="danau-bukit-dekat" d="M 40 270 Q 100 240 140 340 Z" />

    <!-- Dedaunan / Pepohonan Kanan Dekat -->
    <path class="danau-bukit-dekat" d="M 680 300 Q 740 230 820 290 Z" />
    <path class="danau-bukit-dekat" d="M 620 310 Q 680 240 730 340 Z" />
  </g>

  <!-- ==================== 4. AIR DANAU (LAKE WATER) ==================== -->
  <g id="danau-air-grup">
    <!-- Base Air -->
    <rect id="danau-air-dasar" class="danau-air" x="0" y="340" width="800" height="260" />

    <!-- Gelombang / Riple Air (Statis) -->
    <g id="danau-riak-grup">
      <line class="danau-riak" x1="120" y1="370" x2="220" y2="370" />
      <line class="danau-riak" x1="550" y1="360" x2="680" y2="360" />
      <line class="danau-riak" x1="80"  y1="410" x2="260" y2="410" />
      <line class="danau-riak" x1="480" y1="400" x2="600" y2="400" />
      <line class="danau-riak" x1="200" y1="460" x2="340" y2="460" />
      <line class="danau-riak" x1="620" y1="450" x2="740" y2="450" />
      <line class="danau-riak" x1="50"  y1="510" x2="180" y2="510" />
      <line class="danau-riak" x1="450" y1="520" x2="570" y2="520" />
    </g>
  </g>

  <!-- ==================== 4b. PELAMPUNG (VIS.03) ==================== -->
  <!-- Tersembunyi sampai wadah danau mendapat kelas "lempar" (diatur mancing.js, animasi di style.css). -->
  <g id="danau-pelampung" class="danau-pelampung">
    <!-- Lingkaran riak di permukaan air (tidak ikut turun-naik) -->
    <ellipse class="danau-pelampung-riak" cx="400" cy="396" rx="36" ry="9" />
    <!-- Bagian yang jatuh saat dilempar -->
    <g class="danau-pelampung-jatuh">
      <!-- Bagian yang mengapung dan tersentak saat gigitan -->
      <g class="danau-pelampung-badan">
        <rect class="danau-pelampung-antena" x="396" y="346" width="8" height="26" rx="3" />
        <path class="danau-pelampung-merah" d="M 376 392 a 24 24 0 0 1 48 0 Z" />
        <path class="danau-pelampung-putih" d="M 376 392 a 24 24 0 0 0 48 0 Z" />
      </g>
    </g>
  </g>

  <!-- ==================== 5. DERMAGA KAYU (WOODEN PIER) ==================== -->
  <g id="danau-dermaga">
    <!-- Perspektif Dermaga Kayu Utama (Trapesium) -->
    <polygon points="260,600 540,600 470,440 330,440" class="danau-kayu" />

    <!-- Garis Papan Kayu -->
    <polygon points="325,455 475,455 471,460 329,460" class="danau-kayu-gelap" />
    <polygon points="315,475 485,475 480,482 320,482" class="danau-kayu-gelap" />
    <polygon points="302,498 498,498 492,506 308,506" class="danau-kayu-gelap" />
    <polygon points="288,525 512,525 505,534 295,534" class="danau-kayu-gelap" />
    <polygon points="273,558 527,558 519,568 281,568" class="danau-kayu-gelap" />

    <!-- Sisi Samping/Pinggiran Kayu -->
    <polygon points="260,600 273,600 335,440 330,440" class="danau-kayu-gelap" />
    <polygon points="540,600 527,600 465,440 470,440" class="danau-kayu-gelap" />
  </g>
</svg>
