#.github/workflows/pages.yml
# Menerbitkan folder public/ ke GitHub Pages setiap ada push ke cabang main.
name: Terbit ke GitHub Pages

on:
  push:
    branches: [main]
  # Memungkinkan dijalankan manual dari tab Actions bila perlu
  workflow_dispatch:

# Izin minimum yang dibutuhkan untuk menerbitkan Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Satu penerbitan pada satu waktu; yang baru menggantikan yang antre
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Ambil isi repo
        uses: actions/checkout@v4

      - name: Siapkan Pages
        uses: actions/configure-pages@v5

      - name: Kemas folder public
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Terbitkan
        id: deployment
        uses: actions/deploy-pages@v4
